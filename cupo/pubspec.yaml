name: cupo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Backend: autenticación, PostgreSQL y Realtime en un solo paquete.
  # Reemplaza a cloud_firestore, firebase_auth, firebase_core y
  # firebase_database (ver apartado 10 de docs/producto/modelo-de-datos.md).
  supabase_flutter: ^2.8.0

  # Se queda: Supabase no tiene equivalente de Cloud Messaging, así que las
  # notificaciones push de la Iteración 5 siguen siendo FCM.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  flutter_map: ^8.3.2
  geolocator: ^14.0.3
  google_fonts: ^6.2.1
  intl: ^0.20.3
  latlong2: ^0.10.1
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
